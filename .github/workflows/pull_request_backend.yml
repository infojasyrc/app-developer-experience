name: Pull Request Verification Workflow for backend templates

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PLATFORM: linux/amd64

jobs:
  get-changed-packages:
    name: Get list of changed packages
    runs-on: ubuntu-24.04
    outputs:
      changed_packages: ${{ steps.changed-packages.outputs.changed_packages }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changed-packages
        uses: ./.github/actions/get-changed-packages

      - name: Output changed packages
        run: |
          echo "Changed packages: ${{ steps.changed-packages.outputs.changed_packages }}"
          echo ""
          echo "Summary: ${{ steps.changed-packages.outputs.summary }}"

  nestjs-rest-tpl-unit-tests:
    name: running lint and unit tests for nestjs rest template
    needs: get-changed-packages
    if: ${{ contains(needs.get-changed-packages.outputs.changed_packages, 'tpl-nestjs-rest') }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./backend/nestjs-rest-tpl
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build container for development
        run: make build-dev

      - name: Install dependencies
        run: make install-dependencies

      - name: Run Linting
        run: make lint

      - name: Run Unit Tests
        run: make unit-tests

      - name: Build container for production
        run: make build-prod

  nestjs-gql-tpl-unit-tests:
    name: running lint and unit tests for nestjs graphql template
    needs: get-changed-packages
    if: ${{ contains(needs.get-changed-packages.outputs.changed_packages, 'tpl-nestjs-gql') }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./backend/nestjs-gql-tpl
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build container for development
        run: make build-dev

      - name: Install dependencies
        run: make install-dependencies

      - name: Run Linting
        run: make lint

      - name: Run Unit Tests
        run: make unit-tests

      - name: Build container for production
        run: make build-prod

  fastapi-rest-tpl-unit-tests:
    name: running lint and unit tests for fastapi rest template
    needs: get-changed-packages
    if: ${{ contains(needs.get-changed-packages.outputs.changed_packages, 'tpl-fastapi-rest') }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./backend/fastapi-rest-tpl
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build container for development
        run: make build-dev

      - name: Install dependencies
        run: make install-dependencies

      - name: Run Linting
        run: make lint

      - name: Run Unit Tests
        run: make unit-tests

      - name: Build container for production
        run: make build-prod

  pr-gate-templates:
    name: pr-gate-templates
    needs: [get-changed-packages, nestjs-rest-tpl-unit-tests, nestjs-gql-tpl-unit-tests, fastapi-rest-tpl-unit-tests]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce results
        env:
          DETECT: ${{ needs.get-changed-packages.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          # Detection must succeed, otherwise skipped jobs would be false passes
          [[ "$DETECT" == "success" ]] || { echo "Detection: $DETECT"; exit 1; }

          # Each verify job must be success or skipped (not changed), never failure/cancelled
          for r in $RESULTS; do
            [[ "$r" == "success" || "$r" == "skipped" ]] || { echo "Job result: $r"; exit 1; }
          done
