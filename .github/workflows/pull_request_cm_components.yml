name: 🔍 Pull Request Verification Workflow for Conference Manager Components

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

env:
  # common variables
  PLATFORM: linux/amd64

jobs:
  get-changed-packages:
    name: Get list of changed packages
    runs-on: ubuntu-24.04
    outputs:
      changed_packages: ${{ steps.changed-packages.outputs.changed_packages }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changed-packages
        uses: ./.github/actions/get-changed-packages

      - name: Output changed packages
        run: |
          echo "Changed packages: ${{ steps.changed-packages.outputs.changed_packages }}"
          echo ""
          echo "Summary: ${{ steps.changed-packages.outputs.summary }}"
  
  conference-webapp-verify:
    name: running lint and unit tests for conference manager webapp 
    needs: get-changed-packages
    runs-on: ubuntu-24.04
    # Use a gatekeeper logic to only run this job if webapp package is changed
    if: >-
      contains(needs.get-changed-packages.outputs.changed_packages, 'cm-webapp')
    defaults:
      run:
        working-directory: ./conference-manager/ms-conference-webapp
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build container for development
        run: make build-dev

      - name: Install dependencies
        run: make install-dependencies

      - name: Run Linting
        continue-on-error: true
        run: make lint

      - name: Run Unit Tests
        run: make unit-tests

      - name: Build container for production
        run: make build-prod

  conference-api-verify:
    name: running lint and unit tests for conference manager api
    needs: get-changed-packages
    runs-on: ubuntu-24.04
    # Use a gatekeeper logic to only run this job if api package is changed
    if: >-
      contains(needs.get-changed-packages.outputs.changed_packages, 'cm-api')
    defaults:
      run:
        working-directory: ./conference-manager/ms-conference-api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build container for development
        run: make build-dev

      - name: Install dependencies
        run: make install-dependencies

      - name: Run Linting
        continue-on-error: true
        run: make lint

      - name: Run Unit Tests
        run: make unit-tests

      - name: Build container for production
        run: make build-prod

  pr-gate-cm-components:
    name: pr-gate-cm-components
    needs: [get-changed-packages, conference-webapp-verify, conference-api-verify]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce results
        env:
          DETECT: ${{ needs.get-changed-packages.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          # Detection must succeed, otherwise skipped jobs would be false passes
          [[ "$DETECT" == "success" ]] || { echo "Detection: $DETECT"; exit 1; }

          # Each verify job must be success or skipped (not changed), never failure/cancelled
          for r in $RESULTS; do
            [[ "$r" == "success" || "$r" == "skipped" ]] || { echo "Job result: $r"; exit 1; }
          done
