name: Release & Changelog pipeline

# Tag-only releases: nothing is pushed to `main` (the `main` ruleset requires a
# PR). Each job tags the triggering commit and publishes a GitHub release.
# Runbook: docs/standards/release-strategy.md

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      packages:
        description: >
          Space-separated package keys to release even if they did not change
          in the last push (tpl-fastapi-rest tpl-nestjs-rest tpl-nestjs-gql).
          Add `index` to only rebuild artifacts-index.json from existing releases.
        required: false
        default: ''
        type: string

jobs:
  get-changed-packages:
    name: Get list of changed packages
    runs-on: ubuntu-22.04
    outputs:
      changed_packages: ${{ steps.changed-packages.outputs.changed_packages }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: changed-packages
        uses: ./.github/actions/get-changed-packages
      - name: Output changed packages
        run: |
          echo "Changed packages: ${{ steps.changed-packages.outputs.changed_packages }}"
          echo "Forced packages: ${{ inputs.packages }}"

  release-nestjs-rest-tpl:
    name: Release backend/nestjs-rest-tpl
    needs: get-changed-packages
    if: ${{ contains(needs.get-changed-packages.outputs.changed_packages, 'tpl-nestjs-rest') || contains(inputs.packages, 'tpl-nestjs-rest') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Release backend/nestjs-rest-tpl
        uses: ./.github/actions/generate-release-changelog
        with:
          working-directory: ./backend/nestjs-rest-tpl
          project-name: nestjs-rest-tpl

  release-fastapi-rest-tpl:
    name: Release backend/fastapi-rest-tpl
    needs: get-changed-packages
    if: ${{ contains(needs.get-changed-packages.outputs.changed_packages, 'tpl-fastapi-rest') || contains(inputs.packages, 'tpl-fastapi-rest') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Release backend/fastapi-rest-tpl
        uses: ./.github/actions/generate-release-changelog
        with:
          working-directory: ./backend/fastapi-rest-tpl
          project-name: fastapi-rest-tpl

  release-nestjs-gql-tpl:
    name: Release backend/nestjs-gql-tpl
    needs: get-changed-packages
    if: ${{ contains(needs.get-changed-packages.outputs.changed_packages, 'tpl-nestjs-gql') || contains(inputs.packages, 'tpl-nestjs-gql') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Release backend/nestjs-gql-tpl
        uses: ./.github/actions/generate-release-changelog
        with:
          working-directory: ./backend/nestjs-gql-tpl
          project-name: nestjs-gql-tpl

  # Rebuilds artifacts-index.json from every template release that carries a
  # template.yaml and uploads it to the rolling `index` release, which
  # appdevexp reads (a plain asset download, no REST API rate limit).
  publish-artifacts-index:
    name: Publish artifacts-index.json
    needs: [get-changed-packages, release-nestjs-rest-tpl, release-fastapi-rest-tpl, release-nestjs-gql-tpl]
    if: >-
      ${{ always() && needs.get-changed-packages.result == 'success' && (
        needs.release-nestjs-rest-tpl.result == 'success' ||
        needs.release-fastapi-rest-tpl.result == 'success' ||
        needs.release-nestjs-gql-tpl.result == 'success' ||
        contains(inputs.packages, 'index')) }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      PLATFORM: linux/amd64
    steps:
      - name: Checkout code (all tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gather released manifests and checksums
        run: |
          git fetch --tags --force
          RELEASES="$RUNNER_TEMP/releases"
          mkdir -p "$RELEASES"
          for manifest in backend/*/template.yaml; do
            tpl=$(basename "$(dirname "$manifest")")
            for tag in $(git tag --list "${tpl}-v*"); do
              # Releases cut before Phase 1 have no manifest and are not scaffoldable.
              git cat-file -e "${tag}:backend/${tpl}/template.yaml" 2>/dev/null || { echo "skip ${tag}"; continue; }
              gh release view "$tag" > /dev/null 2>&1 || { echo "skip ${tag} (no release)"; continue; }
              mkdir -p "$RELEASES/$tag"
              git show "${tag}:backend/${tpl}/template.yaml" > "$RELEASES/$tag/template.yaml"
              gh release download "$tag" -p '*.tar.gz.sha256' -D "$RELEASES/$tag" --clobber
            done
          done
          ls -R "$RELEASES"

      - name: Build artifacts-index.json with ade-core
        working-directory: ./tools/ade-core
        run: |
          make build-dev
          make install-dependencies
          make build-index RELEASES_DIR="$RUNNER_TEMP/releases" \
            INDEX_OUT="$RUNNER_TEMP/index/artifacts-index.json" REGISTRY="${{ github.repository }}"
          cat "$RUNNER_TEMP/index/artifacts-index.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to the rolling `index` release
        run: |
          if ! gh release view index > /dev/null 2>&1; then
            gh release create index \
              --title "Artifacts index" \
              --notes "Rolling release: artifacts-index.json lists every scaffoldable ADE template version. Regenerated by release.yml; do not delete." \
              --latest=false \
              --target "$GITHUB_SHA"
          fi
          gh release upload index "$RUNNER_TEMP/index/artifacts-index.json" --clobber
