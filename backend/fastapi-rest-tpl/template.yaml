# Template manifest (manifest_schema 1) — read by tools/ade-core.
# Describes how to rename this living template and how to strip optional
# features. Every transform must match the files below, or rendering fails:
# when you move or rename a file referenced here, update this manifest in the
# same PR. CI renders every feature combination and runs the Make targets on
# each result (.github/workflows/pull_request_backend.yml).
manifest_schema: 1
artifact: fastapi-rest
kind: project-template
min_engine_version: 0.1.0
description: FastAPI RESTful service (DDD, container-first)

identity:
  token: fastapi-rest-tpl
  files:
    - .env.public
    - pyproject.toml
    - uv.lock
    - project.json
    - docker-compose/docker-compose.local.yml
    - src/infrastructure/settings.py
    - README.md

# uv.lock is kept (the Dockerfile runs `uv sync --frozen`); only its name is renamed.
exclude:
  - .venv/
  - __pycache__/
  - .pytest_cache/
  - .coverage
  - coverage/
  - htmlcov/
  - dist/

parameters:
  type: object
  additionalProperties: false
  required: [name]
  properties:
    name:
      type: string
      pattern: "^[a-z][a-z0-9-]{1,48}$"
      description: Service name (kebab-case); replaces the template name everywhere
    project_name:
      type: string
      pattern: "^[a-z][a-z0-9-]*$"
      default: app-dev-exp
      description: Container image namespace (`<project_name>/<name>`)
    compose_project_name:
      type: string
      pattern: "^[a-z][a-z0-9_-]*$"
      default: "{{ name }}"
      description: .env.public COMPOSE_PROJECT_NAME
    platform:
      type: string
      enum: [linux/amd64, linux/arm64, linux/x86_64]
      default: linux/amd64
    container_runtime:
      type: string
      enum: [docker, podman, container]
      default: docker
    output_dir:
      type: string
      default: "backend/{{ name }}"
      description: Path of the new project inside its monorepo (nx project.json sourceRoot / cwd)

# Turning a feature off removes its wiring (files, env, compose, Make targets,
# settings). Dependencies stay in pyproject.toml / uv.lock (pruning them needs
# a lockfile regeneration; planned for Phase 2). Alembic migrations are not a
# feature yet: the template ships the dependency but no migration wiring.
features:
  database:
    description: PostgreSQL for local development
    values: [postgres, none]
    default: postgres
    when:
      none:
        remove_files:
          - docker-compose/docker-compose.db.yml
        remove_env: [POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB]
        remove_lines:
          - { file: .env.public, pattern: "^# database connection$" }
          - { file: Makefile, pattern: "\\$\\(COMPOSE_PROJECT_NAME\\)-db-data" }
          - { file: docker-compose/docker-compose.local.yml, pattern: "^\\s+depends_on:$|^\\s+- db$" }
        replace:
          - file: Makefile
            find: "-f docker-compose/docker-compose.db.yml \\\n\t\t-f docker-compose/docker-compose.local.yml"
            with: "-f docker-compose/docker-compose.local.yml"
  auth:
    description: JWT settings (secret keys, algorithm, expirations)
    values: [jwt, none]
    default: jwt
    when:
      none:
        remove_env: [JWT_SECRET_KEY, JWT_REFRESH_SECRET_KEY]
        remove_lines:
          - { file: docker-compose/docker-compose.local.yml, pattern: "^\\s+- JWT_(REFRESH_)?SECRET_KEY=" }
          - { file: src/infrastructure/settings.py, pattern: "^\\s+jwt_[a-z_]+: " }

edits:
  - file: .env.public
    dotenv_set:
      PROJECT_NAME: "{{ project_name }}"
      COMPOSE_PROJECT_NAME: "{{ compose_project_name }}"
      PLATFORM: "{{ platform }}"
      CONTAINER_RUNTIME: "{{ container_runtime }}"
  - file: project.json
    json_set:
      sourceRoot: "{{ output_dir }}"
      "targets.*.options.cwd": "{{ output_dir }}"

next_steps:
  - make create-volumes
  - make build-dev
  - make install-dependencies
  - make lint
  - make unit-tests
