---

services:
  unleash-app:
    image: unleashorg/unleash-server
    container_name: ${COMPOSE_PROJECT_NAME}-unleash-app
    restart: unless-stopped
    platform: ${PLATFORM}
    environment:
      - DATABASE_HOST=unleash-db
      - DATABASE_NAME=${UNLEASH_DB_NAME}
      - DATABASE_USERNAME=${UNLEASH_DB_USERNAME}
      - DATABASE_PASSWORD=${UNLEASH_DB_PASSWORD}
      - DATABASE_SSL=false
    ports:
      - "4242:4242"
    depends_on:
      unleash-db:
        condition: service_healthy

  unleash-db:
    image: postgres:18-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-unleash-db
    restart: always
    platform: ${PLATFORM}
    environment:
      - POSTGRES_PASSWORD=${UNLEASH_DB_PASSWORD}
      - POSTGRES_USER=${UNLEASH_DB_USERNAME}
      - POSTGRES_DB=${UNLEASH_DB_NAME}
    ports:
      - 5433:5432
    volumes:
      - unleash-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UNLEASH_DB_USERNAME} -d ${UNLEASH_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  unleash-db-data:
    name: ${COMPOSE_PROJECT_NAME}-unleash-db-data
    external: true
