[project]
name = "app-dev-exp-cli"
version = "0.2.0"
description = "Monorepo CLI for conventional commits and repository tools"
authors = [
  { name = "Jose Sal y Rosas" }
]
requires-python = ">=3.11"

dependencies = [
  "click>=8.1.8",
  "inquirer>=3.4.0",
  "gitpython>=3.1.44",
  "pyinstaller>=6.10.0",
  "macholib>=1.16.3; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-mock>=3.14.0",
]

[tool.uv]
package = false
constraint-dependencies = [
  "setuptools>=78.0.0",
  "wheel>=0.46.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
