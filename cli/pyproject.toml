[project]
name = "app-dev-exp-cli"
version = "0.3.0"
description = "appdevexp: scaffold projects from ADE templates, conventional commits and repository tools"
authors = [
  { name = "Jose Sal y Rosas" }
]
requires-python = ">=3.13,<3.14"

dependencies = [
  "ade-core",
  "click>=8.1.8",
  "inquirer>=3.4.0",
  "gitpython>=3.1.44",
  "pyyaml>=6.0.2",
  "pyinstaller>=6.10.0",
  "macholib>=1.16.3; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-mock>=3.14.0",
]

[tool.uv]
package = false
constraint-dependencies = [
  "setuptools>=78.0.0",
  "wheel>=0.46.0",
]

# The ADE core engine ships inside the binary. Containers see it at /tools/ade-core
# (dev: bind mount; images: the named build context `ade-core`).
[tool.uv.sources]
ade-core = { path = "../tools/ade-core" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
