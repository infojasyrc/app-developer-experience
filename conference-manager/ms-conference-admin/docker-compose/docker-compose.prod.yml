---

services:

  migrations:
    container_name: ${COMPOSE_PROJECT_NAME}-admin-migrations
    image: ${COMPOSE_PROJECT_NAME}-admin:latest
    working_dir: /app/src
    command: /bin/ash -ci "python manage.py migrate"
    platform: ${PLATFORM}
    tty: true
    environment:
      - ENVIRONMENT=development
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_ROOT_USERNAME=${DB_ROOT_USERNAME}
      - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - DEFAULT_DB=${DEFAULT_DB}
      - MS_PORT=${MS_PORT}

  admin:
    container_name: ${COMPOSE_PROJECT_NAME}-admin
    image: ${COMPOSE_PROJECT_NAME}-admin:latest
    restart: unless-stopped
    platform: ${PLATFORM}
    tty: true
    ports:
      - 3001:3000
    environment:
      - ENVIRONMENT=development
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_ROOT_USERNAME=${DB_ROOT_USERNAME}
      - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - DEFAULT_DB=${DEFAULT_DB}
      - MS_PORT=${MS_PORT}
    depends_on:
      - migrations

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}-network
    external: true
