[project]
name = "ms-conference-admin"
version = "0.1.0"
description = "Conference Manager admin: Django admin over MongoDB"
authors = [
  { name = "Jose Sal y Rosas" }
]
requires-python = ">=3.14,<3.15"

dependencies = [
  "django-mongodb-backend>=5.1.0",
  "pymongo>=4.18.2",
  "tzdata>=2025.2",
]

[dependency-groups]
dev = [
  "black>=26.3.1",
  "flake8>=7.1.1",
  "isort>=5.13.2",
  "pre-commit>=4.3.0",
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  "pytest-django>=4.11.1",
  "pytest-mock>=3.15.1",
]

[tool.uv]
package = false
constraint-dependencies = [
  "pymongo>=4.18.2",
  "virtualenv>=21.7.13",
]

[tool.black]
line-length = 120
target-version = ["py314"]
extend-exclude = "migrations"

[tool.isort]
profile = "black"
line_length = 120
skip_glob = ["**/migrations/*"]

[tool.pytest.ini_options]
testpaths = ["src"]
pythonpath = ["src"]
python_files = ["test_*.py", "tests.py"]
DJANGO_SETTINGS_MODULE = "quickstart.settings"
addopts = "--cov=src --cov-fail-under=80 --cov-report=term-missing"

[tool.coverage.run]
omit = ["*/migrations/*", "*/mongo_migrations/*", "src/manage.py", "*/wsgi.py", "*/asgi.py"]
