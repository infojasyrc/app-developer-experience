---

services:
  api:
    container_name: ${COMPOSE_PROJECT_NAME}-api
    image: ${PROJECT_NAME}/${COMPOSE_PROJECT_NAME}-api:latest
    ports:
      - ${MS_PORT}:${MS_PORT}
    working_dir: /usr/src/app
    platform: ${PLATFORM}
    depends_on:
      unleash-app:
        condition: service_started
    env_file:
      - ../.env
    tty: true
    links:
      - unleash-app

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}-network
    external: true
