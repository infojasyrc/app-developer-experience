---
# Shared MongoDB for ms-conference-api (cm-api) and ms-conference-admin (cm-admin).
# Runs as its own compose project (${COMPOSE_PROJECT_NAME}-db) so stopping one
# service never stops the database the other one is using. Drive it via Make.

services:
  mongodb:
    container_name: ${COMPOSE_PROJECT_NAME}-db
    image: mongo:8.0-noble
    platform: ${PLATFORM}
    restart: unless-stopped
    ports:
      - ${DB_PORT}:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${DB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${DEFAULT_DB}
    volumes:
      - dev-db:/data/db
    networks:
      default:
        aliases:
          - mongodb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}-network
    external: true

volumes:
  dev-db:
    name: ${COMPOSE_PROJECT_NAME}-dev-db
    external: true
