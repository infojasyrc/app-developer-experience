[project]
name = "ade-core"
version = "0.1.0"
description = "ADE core engine: template manifests and deterministic rendering"
authors = [
  { name = "App Developer Experience" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.11.0,<3.0.0",
  "pyyaml==6.0.2",
  "jsonschema>=4.23.0,<5.0.0",
]

[dependency-groups]
dev = [
  "black==24.10.0",
  "flake8==7.1.1",
  "isort==5.13.2",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src --cov-fail-under=80 --cov-report=term-missing"
