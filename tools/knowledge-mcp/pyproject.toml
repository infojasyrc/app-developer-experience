[project]
name = "knowledge-mcp"
version = "0.1.0"
description = "ADE conventions MCP server"
authors = [
  { name = "App Developer Experience" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.115.6",
  "pydantic>=2.11.0,<3.0.0",
  "pydantic-settings>=2.5.2,<3.0.0",
  "python-dotenv==1.0.0",
  "uvicorn==0.34.0",
  "mcp>=1.9.0,<2.0.0",
  "pyyaml==6.0.2",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
black = "24.10.0"
flake8 = "7.1.1"
isort = "5.13.2"
pytest = "8.3.4"
pytest-cov = "6.0.0"
pytest-asyncio = "0.25.0"
httpx = "0.28.1"

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src --cov-fail-under=80 --cov-report=term-missing"
